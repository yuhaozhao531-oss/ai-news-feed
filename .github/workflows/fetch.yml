name: fetch-news

on:
  schedule:
    - cron: "17 */3 * * *"   # 每 3 小时（UTC）
  workflow_dispatch:          # 可在 Actions 页面手动点运行

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - run: python fetch.py
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
      - name: commit
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || (git commit -m "news: $(date -u +%F\ %H:%M)" && git push)
      - name: purge jsDelivr cache   # 国内服务器从 jsDelivr 拉数据，推完立刻刷新缓存
        run: curl -s -m 30 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/news.json" || true
